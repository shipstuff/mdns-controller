{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mdns-controller.fullname" . }}
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mdns-controller.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mdns-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mdns-controller.serviceAccountName" . }}
    namespace: {{ include "mdns-controller.namespace" . }}
{{- end }}

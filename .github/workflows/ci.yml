name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning entrypoint.sh scripts/release.sh

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      - name: Test controller
        working-directory: controller
        run: go test ./...

  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Render chart
        run: |
          helm lint ./helm/mdns-controller
          helm template mdns-controller ./helm/mdns-controller >/dev/null
          helm template mdns-controller ./helm/mdns-controller -f examples/values-servertimeai.yaml >/dev/null

